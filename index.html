  if(c.id==="sys_freegram")return`<div class="av">${PL("#3ddc84","#1f9658")}</div>`;
  if(c.kind==="self")return`<div class="av" style="background:#3390ec">🔖</div>`;
  if(c.kind==="all")return`<div class="av" style="background:linear-gradient(135deg,#6a5acd,#2b1b6b)">🌌</div>`;
  if(c.id==="sys_unban")return`<div class="av" style="background:#e5484d">🛡</div>`;
  if(c.id==="sys_verif")return`<div class="av" style="background:#2a8cff">✓</div>`;
  return`<div class="av" style="background:hsl(${hue(c.id)} 55% 50%)">${esc([...(c.name||"?")][0].toUpperCase())}</div>`;
}

function authView(msg,step){

  $("hd").innerHTML=`<b>FreeGram</b>`;$("nav").innerHTML="";document.querySelector(".bar")?.remove();
  const c=COUNTRIES.find(x=>x[0]===AU.cc),a=AU;
  let h=`<div class="auth"><div class="lang">${a.adding?`<button class="btn g" data-a="cancelAdd">${t("cancel")}</button> `:""}<button class="btn g" data-a="lang">${t("langName")==="English"?"Русский":"English"}</button></div><img src="icon.png" alt=""><h1>${t("hello")}</h1>`;

    if(a.step==="new")h+=`<input class="f" id="un" placeholder="${t("yname")}">`;
    if(a.step==="code")h+=`<input class="f" id="cd" inputmode="numeric" maxlength="6" placeholder="${t("code")}">`;
    if(a.step!=="code"||a.haspw)h+=`<input class="f" id="pw" type="password" placeholder="${t(a.step==="new"?"newpw":"pw")}">`;
    h+=`<div class="err">${esc(a.msg)}</div><button class="btn" data-a="go">${t(a.step==="new"?"signup":"login")}</button> <button class="btn g" data-a="again">${t("back")}</button>`;

async function authNext(){
  const s=$("srv");if(s){API=s.value.trim().replace(/\/+$/,"");ls.s("fg_srv",API)}
  const dial=dialOf(AU.cc);let d=$("ph").value.replace(/\D/g,"");
  if(dial==="7"&&d.length===11&&(d[0]==="8"||d[0]==="7"))d=d.slice(1);
  AU.phone=d;AU.full="+"+dial+d;
  try{const j=await api("/api/check",{phone:AU.full},"x");AU.haspw=j.haspw;AU.step=j.anon?"code":j.exists?"pw":"new";authView("")}catch(e){authView(e.message)}
}
async function authGo(){
  const g=i=>$(i)?$(i).value:"";

  try{
    const j=await api(path,{phone:AU.full,password:g("pw"),name:g("un"),code:g("cd"),dev:DEV},"x");
    const me=await api("/api/me",null,j.token),i=ACCTS.findIndex(a=>a.id===me.id);
    if(i>=0){ACCTS[i].tok=j.token;ACT=i}else{ACCTS.push({tok:j.token,id:me.id,name:me.name});ACT=ACCTS.length-1}
    saveAcc();AU={step:"phone",cc:AU.cc,phone:"",msg:"",adding:false};cur=null;SUB=null;tab="chats";boot();

function pickCountry(){

  const s=sheet(`<b>${t("country")}</b><input class="f" id="cs" placeholder="${t("search")}"><div id="cl">${draw("")}</div>`,(e,s)=>{const r=e.target.closest("[data-cc]");if(r){AU.cc=r.dataset.cc;AU.phone=$("ph")?$("ph").value:"";s.remove();authView("")}});
  $("cs").oninput=e=>{$("cl").innerHTML=draw(e.target.value.toLowerCase())};

function sheet(html,onclick){const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div>${html}</div>`;s.onclick=e=>{if(e.target===s)s.remove();else onclick&&onclick(e,s)};document.body.appendChild(s);return s}

async function boot(){
  if(!TOK())return authView();
  try{ME=await api("/api/me")}catch(e){return ACCTS.length?authView(e.message):authView()}
  ACCTS[ACT].name=ME.name;saveAcc();
  if(es)es.close();
  es=new EventSource(API+"/api/stream?token="+TOK());
  es.addEventListener("msg",()=>{if(cur)refreshMsgs();else if(tab==="chats"&&!SUB)render()});
  es.onerror=()=>setTimeout(()=>{if(ME)api("/api/me").catch(()=>{})},4000);

}

  if(a==="stars"){await api("/api/stars",{amount:$("sa").value});return render()}
  if(d.sell)return ask(t("price"),async v=>{try{await api("/api/list",{id:d.sell,price:v});render()}catch(x){toast(x.message)}});
  if(d.nsell)return ask(t("price"),async v=>{try{await api("/api/nlist",{u:d.nsell,price:v});render()}catch(x){toast(x.message)}});
  if(d.unl){await api("/api/unlist",{id:d.unl});return render()}
  if(d.nunl){await api("/api/nunlist",{u:d.nunl});return render()}
  if(d.buy){await api("/api/buy",{id:d.buy});return render()}
  if(d.nbuy){await api("/api/nbuy",{u:d.nbuy});return render()}
  if(d.pri){await api("/api/primary",{u:d.pri});return render()}
  if(d.st!==undefined){ED.status=d.st;return subView($("main"))}
  if(d.co!==undefined){ED.color=d.co;return subView($("main"))}
  if(a==="saveprof"){await api("/api/profile",{name:$("pn").value,bio:$("pb").value,status:ED.status,color:ED.color});SUB=null;return render()}
  if(d.kick){await api("/api/kick",{sid:d.kick});return render()}
  if(a==="kickall"){await api("/api/kickall",{});return render()}
  if(d.sw!==undefined)return switchTo(+d.sw);
  if(a==="addacc"){AU={step:"phone",cc:AU.cc,phone:"",msg:"",adding:true};cur=null;SUB=null;return authView()}
  if(a==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";return}
  if(a==="logout"){ACCTS.splice(ACT,1);ACT=0;saveAcc();ME=null;cur=null;SUB=null;if(es)es.close();return ACCTS.length?boot():authView()}
  if(a==="asearch")return asearch();
  if(a==="mkbot"){await api("/api/admin/bot",{name:$("bn").value,handle:$("bh").value,lines:$("bl").value});toast(t("done"));return}
  if(d.ad)return adminSheet(JSON.parse(d.ad));
  }catch(x){toast(x.message)}
});
document.addEventListener("input",async e=>{
  if(e.target.id==="q"){const q=e.target.value.trim();if(q.length<2){$("res").innerHTML="";return}
    try{const l=await api("/api/search?q="+encodeURIComponent(q));$("res").innerHTML=l.map(c=>`<div class="row" data-c='${esc(JSON.stringify(c))}'>${av(c)}<div class="t"><b>${nm(c)}</b><div class="s">@${esc(c.handle)}</div></div></div>`).join("")||`<p class="mut">${t("noRes")}</p>`}catch(x){}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="in")sendMsg()});
ACCTS.length?boot():authView();
</script></body></html>
