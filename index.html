    if(r){sh.remove();try{await api("/api/react",{id,e:r.dataset.rxs})}catch(x){toast(x.message)}return refreshMsgs()}
    if(!a)return;sh.remove();const k=a.dataset.ma;
    if(k==="reply"){REPLY={id,fn:m.fn,t:txt};EDIT=null;updRp()}
    if(k==="copy"){try{await navigator.clipboard.writeText(txt);toast(t("done"))}catch(x){}}
    if(k==="edit"){EDIT=id;REPLY=null;$("in").value=m.t;updRp()}
    if(k==="del"){try{await api("/api/del",{id})}catch(x){toast(x.message)}refreshMsgs()}
  });
}
let LPT=0;
document.addEventListener("touchstart",e=>{const r=e.target.closest(".cr[data-c]");if(!r||!$("nav")||$("nav").style.display==="none")return;LPT=setTimeout(()=>{LPT=0;NOCLICK=Date.now()+800;ctxMenu(JSON.parse(r.dataset.c))},550)},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(LPT)},{passive:true}));
document.addEventListener("contextmenu",e=>{const r=e.target.closest(".cr[data-c]");if(r&&$("nav").style.display!=="none"){e.preventDefault();ctxMenu(JSON.parse(r.dataset.c))}});
async function sendMsg(){
  const i=$("in");if(!i)return;const x=i.value.trim();if(!x)return;
  try{
    if(EDIT){await api("/api/edit",{id:EDIT,t:x});EDIT=null}else await api("/api/send",{to:cur.id,t:x,reply:REPLY&&REPLY.id});
    i.value="";REPLY=null;updRp();refreshMsgs();
  }catch(e){toast(e.message);if(e.message===t("E_FROZEN"))openChat({...SYS.ub})}
}
async function asearch(){
  const l=await api("/api/admin/users?q="+encodeURIComponent($("aq").value));
  $("ares").innerHTML=l.map(c=>`<div class="row" data-ad='${esc(JSON.stringify(c))}'>${av(c,44)}<div class="t"><b>${nm(c)}</b><div class="s">${c.handle?"@"+c.handle:""} ${esc(c.phone||"")} ${c.frozen?"❄️":""}</div></div></div>`).join("");
}
function adminSheet(c){
  const isU=c.kind==="user"&&!c.admin;let ask=false;
  sheet(`<b>${nm(c)}</b><div class="mut">${c.handle?"@"+c.handle:""} ${esc(c.phone||"")}</div><h3>${t("badge")}</h3><div class="emo">${["",...BADGES].map(b=>`<span data-vt="${b}" class="${c.badge===b?"on":""}">${b?badge(b):"∅"}</span>`).join("")}</div><label><input type="checkbox" id="ak"> ${t("ask")}</label>`
  +(isU?`<h3></h3><button class="btn g" data-fr="${c.frozen?0:1}">${t(c.frozen?"unfreeze":"freeze")}</button> <button class="btn g" data-ks="1">${t("kickSess")}</button> <button class="btn g" data-as="1">★</button> <button class="btn g" data-ban="1" style="color:#e5484d">${t("ban")}</button>`:""),async(e,s)=>{
    const d=e.target.closest("[data-vt],[data-fr],[data-ks],[data-as],[data-ban]");if(!d)return;const D_=d.dataset;
    try{
      if(D_.vt!==undefined)await api("/api/admin/verify",{id:c.id,type:D_.vt,ask:$("ak").checked});
      else if(D_.fr!==undefined)await api("/api/admin/set",{id:c.id,frozen:D_.fr==="1"});
      else if(D_.ks)await api("/api/admin/kick",{id:c.id});
      else if(D_.as){s.remove();return ask(t("starsPh"),async v=>{try{await api("/api/admin/set",{id:c.id,stars:v});toast(t("done"))}catch(x){toast(x.message)}})}
      else if(D_.ban){if(!confirm(t("confirmBan")))return;await api("/api/admin/ban",{id:c.id})}
      s.remove();toast(t("done"));if(tab==="admin")asearch();
    }catch(x){toast(x.message)}
  });
}
async function checkUpdate(){
  if(!BUILD||(!window.Capacitor&&!/Electron/.test(UA)))return;
  try{const v=await api("/api/version");if(v.latest&&v.latest>BUILD&&v.repo){const url=`https://github.com/${v.repo}/releases/latest/download/FreeGram.${window.Capacitor?"apk":"exe"}`;
    sheet(`<b>${t("updT")}</b><p class="mut">v${v.latest}</p><button class="btn" data-url="${url}">${t("updGo")}</button> <button class="btn g" data-x="1">${t("updLater")}</button>`,(e,s)=>{if(e.target.dataset.url){if(window.Capacitor)location.href=e.target.dataset.url;else window.open(e.target.dataset.url,"_blank")}if(e.target.dataset.x||e.target.dataset.url)s.remove()})}}catch(e){}
}
function switchTo(i){ACT=i;saveAcc();cur=null;SUB=null;tab="chats";ME=null;boot()}
document.addEventListener("click",async e=>{
  const T=e.target.closest("[data-a],[data-t],[data-c],[data-pf],[data-gf],[data-gp],[data-up],[data-cv],[data-cm],[data-mm],[data-rx],[data-vt],[data-fr],[data-ks],[data-as],[data-ban],[data-s],[data-bd],[data-bt],[data-buy],[data-sell],[data-unl],[data-pri],[data-nsell],[data-nunl],[data-nbuy],[data-kick],[data-sw],[data-st],[data-co],[data-ad]");if(!T)return;
  const d=T.dataset,a=d.a;
  try{
  if(Date.now()<NOCLICK)return;
  if(d.pf){e.preventDefault();PF=d.pf;return render()}
  if(a==="pback"){PF=null;return render()}
  if(a==="gift")return giftSheet(cur.id);
  if(a==="gself")return giftSheet(ME.id);
  if(d.gf)return giftSheet(d.gf);
  if(d.gp){await api("/api/gpin",{id:d.gp});return render()}
  if(d.up){await api("/api/upgrade",{id:d.up});toast(t("done"));return render()}
  if(d.cv){await api("/api/convert",{id:d.cv});toast(t("done"));return render()}
  if(d.cm){const q=d.cm.split(":");return chatAct(q[0],q.slice(1).join(":"))}
  if(d.mm&&!e.target.closest("[data-pf]"))return msgMenu(+d.mm);
  if(d.rx){const q=d.rx.split(":");try{await api("/api/react",{id:+q[0],e:q[1]})}catch(x){toast(x.message)}return refreshMsgs()}
  if(a==="rpx"){REPLY=null;EDIT=null;updRp();return}
  if(d.vt!==undefined&&PF){await api("/api/admin/verify",{id:PF,type:d.vt,ask:!!($("ak")&&$("ak").checked)});toast(t("done"));return render()}
  if(d.fr!==undefined&&PF){await api("/api/admin/set",{id:PF,frozen:d.fr==="1"});toast(t("done"));return render()}
  if(d.ks&&PF){await api("/api/admin/kick",{id:PF});toast(t("done"));return}
  if(d.as&&PF)return ask(t("starsPh"),async v=>{try{await api("/api/admin/set",{id:PF,stars:v});toast(t("done"));render()}catch(x){toast(x.message)}});
  if(d.ban&&PF){if(!confirm(t("confirmBan")))return;await api("/api/admin/ban",{id:PF});PF=null;toast(t("done"));return render()}
  if(a==="mkbot"){const r=await api("/api/admin/bot",{name:$("bn").value,handle:$("bh").value,lines:$("bl").value});toast(t("botDone")+": @"+r.handle);$("bn").value=$("bh").value=$("bl").value="";return}

  if(d.bd){const k={triangle:"b_jacops",crown:"b_spfizoor",diamond:"b_g7"}[d.bd];if(k)toast(t(k));return}
  if(a==="lang"){LANG=LANG==="en"?"ru":"en";ls.s("fg_lang",LANG);return ME?render():authView()}
  if(a==="pickc")return pickCountry();
  if(a==="next")return authNext();
  if(a==="go")return authGo();
  if(a==="again")return authView("","phone");
  if(a==="cancelAdd"){AU.adding=false;AU.step="phone";return boot()}
  if(d.t){tab=d.t;cur=null;SUB=null;PF=null;return render()}
  if(d.c){return openChat(JSON.parse(d.c))}
  if(a==="back"){cur=null;return render()}
  if(d.s){SUB=d.s;ED={};return render()}
  if(a==="sback"){SUB=null;return render()}
  if(a==="send")return sendMsg();
  if(d.bt){await api("/api/btn",{id:+d.bt,k:d.k});return refreshMsgs()}
  if(a==="gift"){const inv=await api("/api/inv");
    return sheet(`<b>${t("pickGift")}</b><div class="grid" style="margin-top:10px">${inv.map(g=>card(g,`<button data-sg="${g.id}">${t("send")}</button>`)).join("")||`<span class="mut">${t("noGifts")}</span>`}</div>`,async(ev,s)=>{const id=ev.target.dataset.sg;if(id){try{await api("/api/send",{to:cur.id,gift:id});s.remove();refreshMsgs()}catch(x){toast(x.message)}}})}
  if(a==="shop"){await api("/api/shop",{});return render()}
  if(a==="mkcoll"){await api("/api/names",{u:$("uc").value});return render()}
  if(a==="sethandle"){await api("/api/handle",{u:$("uh").value});return render()}
  if(a==="stars"){await api("/api/stars",{amount:$("sa").value});return render()}
  if(d.sell)return ask(t("price"),async v=>{try{await api("/api/list",{id:d.sell,price:v});render()}catch(x){toast(x.message)}});
  if(d.nsell)return ask(t("price"),async v=>{try{await api("/api/nlist",{u:d.nsell,price:v});render()}catch(x){toast(x.message)}});
  if(d.unl){await api("/api/unlist",{id:d.unl});return render()}
  if(d.nunl){await api("/api/nunlist",{u:d.nunl});return render()}
  if(d.buy){await api("/api/buy",{id:d.buy});return render()}
  if(d.nbuy){await api("/api/nbuy",{u:d.nbuy});return render()}
  if(d.pri){await api("/api/primary",{u:d.pri});return render()}
  if(d.st!==undefined){ED.status=d.st;return subView($("main"))}
  if(d.co!==undefined){ED.color=d.co;return subView($("main"))}
  if(a==="saveprof"){await api("/api/profile",{name:$("pn").value,bio:$("pb").value,status:ED.status,color:ED.color});SUB=null;return render()}
  if(d.kick){await api("/api/kick",{sid:d.kick});return render()}
  if(a==="kickall"){await api("/api/kickall",{});return render()}
  if(d.sw!==undefined)return switchTo(+d.sw);
  if(a==="addacc"){AU={step:"phone",cc:AU.cc,phone:"",msg:"",adding:true};cur=null;SUB=null;return authView()}
  if(a==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";return}
  if(a==="logout"){ACCTS.splice(ACT,1);ACT=0;saveAcc();ME=null;cur=null;SUB=null;if(es)es.close();return ACCTS.length?boot():authView()}
  if(a==="asearch")return asearch();
  if(a==="mkbot"){await api("/api/admin/bot",{name:$("bn").value,handle:$("bh").value,lines:$("bl").value});toast(t("done"));return}
  if(d.ad){PF=JSON.parse(d.ad).id;cur=null;SUB=null;return render()}
  }catch(x){toast(x.message)}
});
document.addEventListener("input",async e=>{
  if(e.target.id==="aq"){asearch();return}
  if(e.target.id==="q"){const q=e.target.value.trim();if(q.length<2){$("res").innerHTML="";return}
    try{const l=await api("/api/search?q="+encodeURIComponent(q));$("res").innerHTML=l.map(c=>`<div class="cr" data-c='${esc(JSON.stringify(c))}'>${av(c,54)}<div class="t"><div class="l1"><b>${nm(c)}</b></div><div class="l2"><span class="s">@${esc(c.handle)}</span></div></div></div>`).join("")||`<p class="mut">${t("noRes")}</p>`}catch(x){}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="in")sendMsg();if(e.key==="Enter"&&e.target.id==="aq")asearch()});
ACCTS.length?boot():authView();
</script></body></html>
