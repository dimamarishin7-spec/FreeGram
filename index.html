<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeGram</title><link rel="icon" href="icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3fb;--card:#fff;--tx:#14181f;--mut:#6b7686;--ac:#7c5cff;--in:#fff;--out:#e3dcff;--bd:#dfe5ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131a;--card:#1a1f2a;--tx:#eef1f6;--mut:#8c97a8;--ac:#9a82ff;--in:#222937;--out:#3b3170;--bd:#2a3140}}
:root[data-theme=dark]{--bg:#10131a;--card:#1a1f2a;--tx:#eef1f6;--mut:#8c97a8;--ac:#9a82ff;--in:#222937;--out:#3b3170;--bd:#2a3140}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-weight:600}
header .sp{flex:1}.pill{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:14px}
main{flex:1;overflow-y:auto;padding:12px;min-height:0}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--ac);font-weight:600}
.row{display:flex;gap:12px;align-items:center;padding:10px;background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.row .t{flex:1;min-width:0}.row .s{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--in);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--out)}.m small{color:var(--mut);margin-left:8px;font-size:11px}.m .nm{color:var(--ac);font-weight:600;font-size:13px;display:block}
.bar{display:flex;gap:8px;padding:8px;background:var(--card);border-top:1px solid var(--bd)}
.bar input{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:10px 14px;font:inherit;min-width:0}
.btn{border:0;background:var(--ac);color:#fff;border-radius:20px;padding:10px 16px;font:inherit;cursor:pointer;margin:2px 0}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.gift{width:230px;border-radius:18px;padding:14px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2))}
.gift.me{align-self:flex-end}.gift.in{align-self:flex-start}.gift .em{font-size:64px;line-height:1.1}
.gift .at{font-size:13px;text-align:left;margin-top:8px;background:#0003;border-radius:10px;padding:6px 10px}.gift .at div{display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:16px;padding:12px;color:#fff;text-align:center;background:linear-gradient(160deg,var(--c1),var(--c2));font-size:13px}
.card .em{font-size:44px}.card button{margin:6px 2px 0;border:0;border-radius:12px;background:#0004;color:#fff;padding:5px 10px;font:inherit;cursor:pointer}
h3{margin:16px 4px 8px}.mut{color:var(--mut)}.err{color:#e5484d;min-height:1.4em}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px;max-height:75%;overflow:auto}
input.f{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px;font:inherit;margin:6px 0}
.auth{padding:24px 16px;text-align:center}.auth h1{margin:8px 0 4px}.auth img{width:110px;height:110px;border-radius:26px}.auth .f{text-align:center}
</style></head><body>
<div id="app"><header><span id="title">FreeGram</span><span class="sp"></span><span class="pill" id="st"></span></header><main id="main"></main><nav id="nav"></nav></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={g:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const guess=location.protocol.startsWith("http")&&!(location.hostname==="localhost"&&!location.port)?location.origin:"";
let API=ls.g("fg_srv")||guess,TOK=ls.g("fg_tok"),ME=null,tab="chats",cur=null,es=null,PH="";
const fmt=n=>Number(n).toLocaleString("ru-RU");
async function api(p,b){
  const r=await fetch(API+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TOK},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&TOK&&ME)logout();throw new Error(j.error||"Ошибка")}
  return j;
}
function logout(){TOK="";ME=null;cur=null;ls.s("fg_tok","");if(es)es.close();authView()}
function authView(msg,step){
  $("nav").innerHTML="";document.querySelector(".bar")?.remove();$("title").textContent="FreeGram";$("st").textContent="";
  const logo='<img src="icon.png" alt=""><h1>FreeGram</h1>';
  $("main").innerHTML=step==="code"
   ?`<div class="auth">${logo}<p class="mut">Код отправлен на ${esc(PH)}.<br>Он придёт в Telegram от «Verification Codes».</p><div class="err">${esc(msg||"")}</div><input class="f" id="cd" inputmode="numeric" maxlength="5" placeholder="Код из 5 цифр"><button class="btn" data-a="verify">Войти</button> <button class="btn g" data-a="again">Назад</button></div>`
   :`<div class="auth">${logo}<p class="mut">Введи номер телефона</p><input class="f" id="ph" type="tel" placeholder="+7 999 123 45 67" value="${esc(PH)}"><details class="mut"><summary>Адрес сервера</summary><input class="f" id="srv" placeholder="https://имя.onrender.com" value="${esc(API)}"></details><div class="err">${esc(msg||"")}</div><button class="btn" data-a="code">Далее</button></div>`;
}
async function getCode(){
  PH=$("ph").value.trim();const s=$("srv");if(s){API=s.value.trim().replace(/\/+$/,"");ls.s("fg_srv",API)}
  try{const j=await api("/api/code",{phone:PH});authView(j.via==="demo"?"Демо-режим, твой код: "+j.code:"","code")}
  catch(e){authView(e.message==="Failed to fetch"?"Нет связи с сервером (он мог уснуть, подожди минуту и повтори)":e.message)}
}
async function verify(){
  try{const j=await api("/api/verify",{phone:PH,code:$("cd").value});TOK=j.token;ls.s("fg_tok",TOK);boot()}
  catch(e){authView(e.message,"code")}
}
async function boot(){
  try{ME=await api("/api/me")}catch(e){return authView()}
  if(es)es.close();
  es=new EventSource(API+"/api/stream?token="+TOK);
  es.addEventListener("msg",()=>{if(cur)refreshMsgs();else if(tab==="chats")render()});
  render();
}
const giftHtml=(g,w)=>`<div class="gift ${w}" style="--c1:${g.c[0]};--c2:${g.c[1]}"><div class="em">${g.e}</div><b>${w==="me"?"Подарок от вас":"Подарок"}</b><div>${esc(g.n)} #${g.num}</div><div class="at"><div><span>Модель</span><b>${esc(g.model)}</b></div><div><span>Фон</span><b>${esc(g.bg)}</b></div><div><span>Значок</span><b>${esc(g.sym)}</b></div></div></div>`;
const card=(g,btns)=>`<div class="card" style="--c1:${g.c[0]};--c2:${g.c[1]}"><div class="em">${g.e}</div><b>${esc(g.n)} #${g.num}</b><div>${esc(g.model)}<br>${esc(g.bg)} · ${esc(g.sym)}</div>${g.price!=null?`<div>★ ${fmt(g.price)}</div>`:""}${btns||""}</div>`;
const nrow=(n,btns)=>`<div class="row" style="cursor:default"><div class="av">@</div><div class="t"><b>@${esc(n.u)}</b><div class="s">${esc(n.r)}${n.primary?" · основной":""}${n.price!=null?" · ★ "+fmt(n.price):""}</div></div>${btns||""}</div>`;
const tm=ts=>new Date(ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function sheet(html,onclick){const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div>${html}</div>`;s.onclick=e=>{if(e.target===s)s.remove();else onclick&&onclick(e,s)};document.body.appendChild(s);return s}
function ask(title,cb){sheet(`<b>${esc(title)}</b><input class="f" id="ask" inputmode="numeric"><button class="btn" data-ok="1">ОК</button>`,(e,s)=>{if(e.target.dataset.ok){const v=$("ask").value.trim();s.remove();cb(v)}});$("ask").focus()}
async function refreshMsgs(){
  if(!cur)return;
  try{const j=await api("/api/messages?with="+encodeURIComponent(cur.id)),box=$("msgs");if(!box)return;
    box.innerHTML=j.map(m=>{const w=m.from===ME.id?"me":"in";return m.g?giftHtml(m.g,w):`<div class="m ${w}">${cur.id==="all"&&w==="in"?`<span class="nm">${esc(m.fn)}</span>`:""}${esc(m.t)}<small>${tm(m.ts)}</small></div>`}).join("");
    $("main").scrollTop=$("main").scrollHeight}catch(e){}
}
async function render(){
  try{ME=await api("/api/me")}catch(e){}
  $("st").textContent="★ "+fmt(ME.stars);
  $("nav").innerHTML=[["chats","💬","Чаты"],["gifts","🎁","Подарки"],["market","🛒","Маркет"],["me","👤","Профиль"]].map(t=>`<button class="${tab===t[0]&&!cur?"on":""}" data-t="${t[0]}">${t[1]}<br>${t[2]}</button>`).join("");
  const m=$("main");
  if(cur){
    $("title").innerHTML=`<a href="#" data-a="back" style="color:var(--ac);text-decoration:none">‹</a> ${esc(cur.name)}`;
    if(!$("in")){m.innerHTML='<div class="msgs" id="msgs"></div>';const b=document.createElement("div");b.className="bar";b.innerHTML='<button class="btn g" data-a="gift">🎁</button><input id="in" placeholder="Сообщение"><button class="btn" data-a="send">➤</button>';$("app").insertBefore(b,$("nav"))}
    return refreshMsgs();
  }
  document.querySelector(".bar")?.remove();
  $("title").textContent={chats:"FreeGram",gifts:"Мои подарки",market:"Маркет",me:"Профиль"}[tab];
  try{
  if(tab==="chats"){const l=await api("/api/chats");
    m.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px"><input class="f" id="nu" placeholder="Написать по @юзернейму" style="margin:0"><button class="btn" data-a="newchat">+</button></div>`+l.map(c=>`<div class="row" data-c="${esc(c.id)}" data-n="${esc(c.name)}"><div class="av">${c.id==="all"?"🌌":"💬"}</div><div class="t"><b>${esc(c.name)}</b><div class="s">${esc(c.last)}</div></div></div>`).join("")}
  if(tab==="gifts"){const inv=await api("/api/inv");
    m.innerHTML=`<button class="btn" data-a="shop">🛍 Купить подарок за 100 ★</button><h3>Подарки (${inv.length})</h3><div class="grid">${inv.map(g=>card(g,g.price==null?`<button data-sell="${g.id}">Продать</button>`:`<button data-unl="${g.id}">Снять</button>`)).join("")}</div>`}
  if(tab==="market"){const [gl,nl]=await Promise.all([api("/api/market"),api("/api/nmarket")]);
    m.innerHTML=`<h3>Подарки</h3><div class="grid">${gl.map(g=>card(g,g.owner===ME.id?`<button data-unl="${g.id}">Снять</button>`:`<button data-buy="${g.id}">Купить</button>`)).join("")||'<span class="mut">Пока пусто</span>'}</div><h3>Юзернеймы</h3>${nl.map(n=>nrow(n,n.mine?`<button class="btn g" data-nunl="${esc(n.u)}">Снять</button>`:`<button class="btn" data-nbuy="${esc(n.u)}">Купить</button>`)).join("")||'<span class="mut">Пока пусто</span>'}`}
  if(tab==="me")m.innerHTML=`<div class="row" style="cursor:default"><div class="av">👤</div><div class="t"><b>${esc(ME.name)}</b><div class="s">@${esc(ME.handle)} · ${esc(ME.phone)}</div></div></div>
  <label class="mut">Имя</label><input class="f" id="pn" value="${esc(ME.name)}"><button class="btn" data-a="saveprof">Сохранить</button>
  <h3>Звёзды: ★ ${fmt(ME.stars)}</h3><input class="f" id="sa" inputmode="numeric" placeholder="Сколько звёзд поставить себе"><button class="btn" data-a="stars">Установить баланс</button>
  <h3>Мои юзернеймы (${ME.names.length})</h3>${ME.names.map(n=>nrow(n,(n.primary?"":`<button class="btn g" data-pri="${esc(n.u)}">Основной</button>`)+(n.price==null?`<button class="btn g" data-nsell="${esc(n.u)}">Продать</button>`:`<button class="btn g" data-nunl="${esc(n.u)}">Снять</button>`))).join("")}
  <input class="f" id="un" placeholder="Новый @юзернейм"><p class="mut">Цена создания: до 4 символов ★500, 5-6 символов ★100, длиннее ★10.</p><button class="btn" data-a="claim">Создать юзернейм</button>
  <h3></h3><button class="btn g" data-a="theme">Тема</button> <button class="btn g" data-a="logout">Выйти</button>`;
  }catch(e){m.innerHTML=`<p class="err">${esc(e.message)}</p>`}
}
async function sendMsg(){const i=$("in"),t=i.value.trim();if(!t)return;i.value="";try{await api("/api/send",{to:cur.id,t});refreshMsgs()}catch(e){alert(e.message)}}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a],[data-t],[data-c],[data-buy],[data-sell],[data-unl],[data-pri],[data-nsell],[data-nunl],[data-nbuy]");if(!t)return;
  const d=t.dataset,a=d.a;
  try{
  if(a==="code"||a==="again")return a==="code"?getCode():authView();
  if(a==="verify")return verify();
  if(d.t){tab=d.t;cur=null;return render()}
  if(d.c){cur={id:d.c,name:d.n};return render()}
  if(a==="back"){e.preventDefault();cur=null;return render()}
  if(a==="send")return sendMsg();
  if(a==="newchat"){const u=await api("/api/user?u="+encodeURIComponent($("nu").value));cur={id:u.id,name:u.name+" @"+u.handle};return render()}
  if(a==="gift"){if(cur.id==="all")return alert("Подарки дарят в личных чатах");const inv=await api("/api/inv");
    return sheet(`<b>Выбери подарок</b><div class="grid" style="margin-top:10px">${inv.map(g=>card(g,`<button data-sg="${g.id}">Отправить</button>`)).join("")||'<span class="mut">Нет подарков</span>'}</div>`,async(ev,s)=>{const id=ev.target.dataset.sg;if(id){try{await api("/api/send",{to:cur.id,gift:id});s.remove();refreshMsgs()}catch(x){alert(x.message)}}})}
  if(a==="shop"){await api("/api/shop",{});return render()}
  if(a==="claim"){await api("/api/names",{u:$("un").value});return render()}
  if(a==="stars"){await api("/api/stars",{amount:$("sa").value});return render()}
  if(d.sell)return ask("Цена в звёздах",async v=>{try{await api("/api/list",{id:d.sell,price:v});render()}catch(x){alert(x.message)}});
  if(d.nsell)return ask("Цена в звёздах",async v=>{try{await api("/api/nlist",{u:d.nsell,price:v});render()}catch(x){alert(x.message)}});
  if(d.unl){await api("/api/unlist",{id:d.unl});return render()}
  if(d.nunl){await api("/api/nunlist",{u:d.nunl});return render()}
  if(d.buy){await api("/api/buy",{id:d.buy});return render()}
  if(d.nbuy){await api("/api/nbuy",{u:d.nbuy});return render()}
  if(d.pri){await api("/api/primary",{u:d.pri});return render()}
  if(a==="saveprof"){await api("/api/profile",{name:$("pn").value});return render()}
  if(a==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";return}
  if(a==="logout")return logout();
  }catch(x){alert(x.message)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="in")sendMsg()});
TOK?boot():authView();
</script></body></html>
